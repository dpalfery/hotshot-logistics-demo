name: Dot Net API Build and Test

on:
  pull_request:
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/Directory.Build.props'
      - '**/Directory.Build.targets'
      - '**/.editorconfig'
      - 'stylecop.json'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - develop
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/Directory.Build.props'
      - '**/Directory.Build.targets'
      - '**/.editorconfig'
      - 'stylecop.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: |
          for proj in $(find . -name '*.csproj'); do
            dotnet restore "$proj"
          done
      - name: Install formatter
        run: dotnet tool update -g dotnet-format
      - name: Lint
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          # Enforce style + analyzer severities from .editorconfig (IDE0005 unused usings, etc.).
          # --severity warn includes warning-level code-style diagnostics in verify mode.
          for proj in $(find . -name '*.csproj'); do
            dotnet format analyzers "$proj" --severity warn --verify-no-changes --no-restore --verbosity diagnostic
            dotnet format style "$proj" --severity warn --verify-no-changes --no-restore --verbosity diagnostic
            dotnet format whitespace "$proj" --verify-no-changes --no-restore --verbosity diagnostic
          done
      - name: Build
        run: |
          # Directory.Build.props enables EnforceCodeStyleInBuild and treats IDE0005 as error.
          for proj in $(find . -name '*.csproj'); do
            dotnet build "$proj" --configuration Release --no-restore -warnaserror:IDE0005
          done
      - name: Test
        run: |
          for proj in $(find ./5-Test -name '*.csproj'); do
            dotnet test "$proj" --no-build --configuration Release
          done

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # For pull requests, we need the merge commit and base branch
          # For push events, we only need the current commit
          fetch-depth: 0

      # The action already passes --fail and --no-update to the TruffleHog CLI, so the
      # scan exits 183 on findings and fails the job. Repeating either flag in
      # extra_args aborts the scan with "flag 'fail' cannot be repeated" before any
      # secret is detected. --results=verified scopes the built-in --fail to live
      # secrets so unverified false positives do not fail the build.
      - name: Run TruffleHog (Pull Request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified

      - name: Run TruffleHog (Push/Workflow Dispatch)
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified

  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Check for outdated packages
        run: |
          for proj in $(find . -name '*.csproj'); do
            echo "Checking $proj for outdated packages..."
            dotnet list "$proj" package --outdated || true
          done
