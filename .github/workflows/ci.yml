name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      dashboard: ${{ steps.areas.outputs.dashboard }}
      docs: ${{ steps.areas.outputs.docs }}
      skills: ${{ steps.areas.outputs.skills }}
      terraform: ${{ steps.areas.outputs.terraform }}
      codeql: ${{ steps.areas.outputs.codeql }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Classify changed files
        id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          all() {
            {
              echo "backend=true"
              echo "dashboard=true"
              echo "docs=true"
              echo "skills=true"
              echo "terraform=true"
              echo 'codeql=["csharp","javascript-typescript"]'
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          [ "${EVENT_NAME}" = "pull_request" ] || all
          if ! git fetch --no-tags --depth=1 origin "${BASE_SHA}" || ! files="$(git diff --name-only "${BASE_SHA}" HEAD 2>/dev/null)"; then
            echo "Could not fetch or diff against ${BASE_SHA}; running all CI jobs."
            all
          fi
          printf 'Changed files:\n%s\n' "${files}"
          [ -n "${files}" ] || all

          if grep -Eq '^\.github/(workflows/ci\.yml|actions/|codeql/)|^7-Deployment/ci/' <<<"${files}"; then
            all
          fi

          has() {
            if grep -Eq "$1" <<<"${files}"; then
              echo true
            else
              echo false
            fi
          }

          backend="$(has '(\.(cs|csproj|props|targets|sln|slnx|editorconfig)$|^global\.json$|^stylecop\.json$|(^|/)nuget\.config$|^(0-Base|1-Presentation/HotshotLogistics\.Api|2-Application|3-Domain|4-Persistence|5-Test|7-Deployment/DbSetup|7-Deployment/docker-compose\.yml)/)')"
          dashboard="$(has '^1-Presentation/admin-dashboard/')"
          docs="$(has '^(6-Docs/|AGENTS\.md$|\.kyber-weave/)')"
          skills="$(has '^\.agents/skills/')"
          terraform="$(has '^7-Deployment/Azure-deploy/')"
          cs_code="$(has '(\.(cs|csproj|props|targets|sln|slnx)$|^Directory\.Build\.props$)')"
          js_code="$(has '^1-Presentation/admin-dashboard/.*\.(js|mjs|cjs|mts|cts|ts|tsx|jsx)$')"

          langs=()
          [ "${cs_code}" = true ] && langs+=('"csharp"')
          [ "${js_code}" = true ] && langs+=('"javascript-typescript"')
          codeql="[$(IFS=,; echo "${langs[*]:-}")]"

          {
            echo "backend=${backend}"
            echo "dashboard=${dashboard}"
            echo "docs=${docs}"
            echo "skills=${skills}"
            echo "terraform=${terraform}"
            echo "codeql=${codeql}"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  backend:
    name: Backend build, format & tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore HotshotLogistics.sln

      - name: Format check (whitespace)
        run: dotnet format HotshotLogistics.sln whitespace --verify-no-changes --no-restore -v minimal

      - name: Format check (style)
        run: dotnet format HotshotLogistics.sln style --verify-no-changes --severity warn --no-restore -v minimal

      - name: Audit vulnerable NuGet packages
        run: |
          set -euo pipefail
          dotnet list HotshotLogistics.sln package --vulnerable --include-transitive --format json |
            python3 7-Deployment/ci/ci_helpers.py check-nuget-json

      - name: Build solution
        run: dotnet build HotshotLogistics.sln -c Release --no-restore -nr:false -p:UseSharedCompilation=false

      - name: Start ephemeral SQL Server and provision test database
        run: |
          set -euo pipefail
          SA_PASSWORD="Aa1!$(openssl rand -hex 16)"
          APP_PASSWORD="Aa1!$(openssl rand -hex 12)"
          echo "::add-mask::${SA_PASSWORD}"
          echo "::add-mask::${APP_PASSWORD}"

          docker run -d --name ci-sqlserver -p 1433:1433 \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="${SA_PASSWORD}" \
            mcr.microsoft.com/mssql/server:2022-latest >/dev/null

          ready=0
          for _ in $(seq 1 36); do
            if docker exec -e SQLCMDPASSWORD="${SA_PASSWORD}" ci-sqlserver \
              /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -l 3 -Q "SELECT 1" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "${ready}" -ne 1 ]; then
            echo "::error::SQL Server container failed to become ready within timeout."
            docker logs ci-sqlserver || true
            exit 1
          fi

          SA_CS="Server=localhost,1433;Database=master;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
          MIGRATION_CS="Server=localhost,1433;Database=hotshot_logistics_test;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
          APP_CS="Server=localhost,1433;Database=hotshot_logistics_test;User Id=hotshot_app;Password=${APP_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
          echo "::add-mask::${SA_CS}"
          echo "::add-mask::${MIGRATION_CS}"
          echo "::add-mask::${APP_CS}"

          CI_SA_CONNECTION_STRING="${SA_CS}" HOTSHOT_DB_PASSWORD="${APP_PASSWORD}" \
            dotnet run -c Release --no-build --project 7-Deployment/DbSetup/HotshotLogistics.DbSetup/HotshotLogistics.DbSetup.csproj -- \
            --server "localhost,1433" --db-name "hotshot_logistics_test" --app-user "hotshot_app" --non-interactive

          ConnectionStrings__DefaultConnection="${MIGRATION_CS}" \
            dotnet run -c Release --no-build --project 4-Persistence/MigrationRunner/MigrationRunner.csproj

          echo "ConnectionStrings__DefaultConnection=${APP_CS}" >> "$GITHUB_ENV"

      - name: Test (HotshotLogistics.Tests)
        run: dotnet test 5-Test/tests/HotshotLogistics.Tests/HotshotLogistics.Tests.csproj -c Release --no-build

      - name: Test (HotshotLogistics.IntegrationTests)
        run: dotnet test 5-Test/tests/HotshotLogistics.IntegrationTests/HotshotLogistics.IntegrationTests.csproj -c Release --no-build

      - name: Test (HotshotLogistics.Api.Tests)
        run: dotnet test 5-Test/HotshotLogistics.Api.Tests/HotshotLogistics.Api.Tests.csproj -c Release --no-build

      - name: Test (HotshotLogistics.DbSetup.Tests)
        run: dotnet test 7-Deployment/DbSetup/HotshotLogistics.DbSetup.Tests/HotshotLogistics.DbSetup.Tests.csproj -c Release --no-build

      - name: Stop ephemeral SQL Server container
        if: always()
        run: docker rm -f ci-sqlserver >/dev/null 2>&1 || true

  dashboard:
    name: Dashboard lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    defaults:
      run:
        working-directory: 1-Presentation/admin-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: 1-Presentation/admin-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx --no-install tsc --noEmit --pretty false

      - name: Build
        run: npm run build

  dashboard-e2e:
    name: Dashboard Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    defaults:
      run:
        working-directory: 1-Presentation/admin-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: 1-Presentation/admin-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run Playwright specs (chromium)
        run: npx --no-install playwright test --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: 1-Presentation/admin-dashboard/playwright-report/
          retention-days: 14

  docs-gate:
    name: Docs & links gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history lets kyber-weave docs validate --merge-ready resolve git merge-base.
          fetch-depth: 0

      - name: Setup Kyber-Weave CLI
        uses: ./.github/actions/setup-kyber-weave

      - name: Validate markdown links, todo index, and CI helpers
        run: |
          python3 -m unittest discover -s 7-Deployment/ci -v
          python3 7-Deployment/ci/ci_helpers.py check-docs --root .

      - name: Validate documentation ontology & merge-ready lifecycle
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if [ -z "${BASE_REF}" ]; then
              echo "::error::Missing github.base_ref on pull_request event."
              exit 1
            fi
            if ! git fetch --no-tags origin "${BASE_REF}"; then
              echo "::error::Failed to fetch pull request base branch 'origin/${BASE_REF}'."
              exit 1
            fi
            BASE="origin/${BASE_REF}"
          elif [ -n "${EVENT_BEFORE}" ] && [ "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags --depth=1 origin "${EVENT_BEFORE}"; then
                echo "::error::Failed to fetch push base commit '${EVENT_BEFORE}'."
                exit 1
              fi
            fi
            BASE="${EVENT_BEFORE}"
          elif git rev-parse --verify "HEAD~1^{commit}" >/dev/null 2>&1; then
            BASE="HEAD~1"
          elif git rev-parse --verify "origin/HEAD^{commit}" >/dev/null 2>&1 \
            && [ "$(git rev-parse "origin/HEAD^{commit}")" != "$(git rev-parse HEAD)" ]; then
            BASE="origin/HEAD"
          else
            echo "::warning::No distinct base commit found (${EVENT_NAME}); validating docs without --base diff scope."
            kyber-weave docs validate . --merge-ready --format table
            exit 0
          fi

          if ! base_sha="$(git rev-parse --verify "${BASE}^{commit}" 2>/dev/null)"; then
            echo "::error::Resolved base ref '${BASE}' does not exist locally."
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          if [ "${base_sha}" = "${head_sha}" ]; then
            echo "::error::Resolved base ref '${BASE}' (${base_sha}) equals HEAD (${head_sha}); refusing vacuous merge-ready diff."
            exit 1
          fi

          echo "Validating docs with merge-ready base ${BASE} (${base_sha}) against HEAD (${head_sha})"
          kyber-weave docs validate . --merge-ready --base "${BASE}" --format table

  skill-gate:
    name: Skill hygiene gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    permissions:
      contents: read
      security-events: write
    env:
      SKILL_DIRS: ".agents/skills"
      MIN_DESC_SCORE: "70"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Kyber-Weave CLI
        uses: ./.github/actions/setup-kyber-weave

      - name: Validate, lint & scan repository skills
        run: |
          set -euo pipefail
          EXIT_CODE=0
          scanned_count=0
          mkdir -p kyber-weave-sarif
          read -r -a skill_dirs <<< "${SKILL_DIRS}" || true
          if [ "${#skill_dirs[@]}" -eq 0 ]; then
            echo "::error::SKILL_DIRS must list at least one directory."
            exit 1
          fi
          for skills_dir in "${skill_dirs[@]}"; do
            if [ ! -d "${skills_dir}" ]; then
              echo "::warning::Skipping missing skill directory: ${skills_dir}"
              continue
            fi
            scanned_count=$((scanned_count + 1))
            slug="$(printf '%s' "${skills_dir}" | tr -c 'A-Za-z0-9' '_')"
            digest="$(printf '%s' "${skills_dir}" | sha256sum | awk '{print substr($1,1,12)}')"
            safe_name="${slug}-${digest}"
            echo "::group::${skills_dir}"
            kyber-weave skill validate "${skills_dir}" --format table || EXIT_CODE=1
            kyber-weave skill lint "${skills_dir}" --min-desc-score "${MIN_DESC_SCORE}" --format table || EXIT_CODE=1
            sarif_file="kyber-weave-sarif/skills-${safe_name}.sarif"
            scan_ok=true
            if ! kyber-weave skill scan "${skills_dir}" --fail-on critical --format sarif > "${sarif_file}"; then
              EXIT_CODE=1
              scan_ok=false
            fi
            if [ -s "${sarif_file}" ] && jq -e '.runs | type == "array"' "${sarif_file}" >/dev/null 2>&1; then
              if jq --arg category "kyber-weave-skills-${safe_name}/" \
                '.runs |= map(.automationDetails.id = $category)' "${sarif_file}" > "${sarif_file}.tmp" \
                && mv "${sarif_file}.tmp" "${sarif_file}"; then
                :
              else
                rm -f "${sarif_file}.tmp" "${sarif_file}"
                EXIT_CODE=1
              fi
            else
              rm -f "${sarif_file}"
              if [ "${scan_ok}" = "true" ]; then
                echo "::error::kyber-weave skill scan produced empty or invalid SARIF for ${skills_dir}."
                EXIT_CODE=1
              fi
            fi
            echo "::endgroup::"
          done
          if [ "${scanned_count}" -eq 0 ]; then
            echo "::error::No existing skill directories found in SKILL_DIRS (${SKILL_DIRS})."
            exit 1
          fi
          exit "${EXIT_CODE}"

      - name: Upload skill scan SARIF
        if: always() && hashFiles('kyber-weave-sarif/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: kyber-weave-sarif
          category: kyber-weave-skills

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.codeql != '[]'
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.codeql) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  secret-scanning:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Ensure PR commits are available
        id: pr_commits
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${BASE_SHA}" 2>/dev/null || git fetch --no-tags --depth=1 origin "${BASE_SHA}" 2>/dev/null || true
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head" 2>/dev/null || git fetch --no-tags origin "${HEAD_SHA}" 2>/dev/null || true
          fi

          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null \
            && git rev-list --count "${BASE_SHA}..${HEAD_SHA}" >/dev/null 2>&1; then
            {
              echo "mode=range"
              echo "base=${BASE_SHA}"
              echo "head=${HEAD_SHA}"
            } >> "$GITHUB_OUTPUT"
          elif git cat-file -e "HEAD^1^{commit}" 2>/dev/null && git cat-file -e "HEAD^2^{commit}" 2>/dev/null; then
            echo "::warning::Could not verify ${BASE_SHA}..${HEAD_SHA} directly; falling back to merge commit parents."
            {
              echo "mode=range"
              echo "base=$(git rev-parse HEAD^1)"
              echo "head=$(git rev-parse HEAD^2)"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not resolve PR commit range (${BASE_SHA}..${HEAD_SHA}); falling back to full repository TruffleHog scan."
            echo "mode=repo" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TruffleHog (Pull Request)
        if: github.event_name == 'pull_request' && steps.pr_commits.outputs.mode == 'range'
        uses: trufflesecurity/trufflehog@d232362a64a09a9e7d58267b8f5acef00ae90e23 # v3.100.0
        with:
          path: ./
          base: ${{ steps.pr_commits.outputs.base }}
          head: ${{ steps.pr_commits.outputs.head }}
          extra_args: --results=verified

      - name: Run TruffleHog (Push/Schedule/Dispatch or Fallback)
        if: github.event_name != 'pull_request' || steps.pr_commits.outputs.mode != 'range'
        uses: trufflesecurity/trufflehog@d232362a64a09a9e7d58267b8f5acef00ae90e23 # v3.100.0
        with:
          path: ./
          extra_args: --results=verified

  terraform-validate:
    name: Terraform Validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 7-Deployment/Azure-deploy/solution/HotshotLogistics
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Init (backend disabled)
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - backend
      - dashboard
      - dashboard-e2e
      - docs-gate
      - skill-gate
      - codeql
      - secret-scanning
      - terraform-validate
    if: always()
    steps:
      - name: Evaluate gate results
        run: |
          set -euo pipefail
          {
            echo "## CI Results"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Detect changed areas | ${{ needs.changes.result }} |"
            echo "| Backend build, format & tests | ${{ needs.backend.result }} |"
            echo "| Dashboard lint, typecheck & build | ${{ needs.dashboard.result }} |"
            echo "| Dashboard Playwright e2e | ${{ needs.dashboard-e2e.result }} |"
            echo "| Docs & links gate | ${{ needs.docs-gate.result }} |"
            echo "| Skill hygiene gate | ${{ needs.skill-gate.result }} |"
            echo "| CodeQL | ${{ needs.codeql.result }} |"
            echo "| Secret Scan (TruffleHog) | ${{ needs.secret-scanning.result }} |"
            echo "| Terraform Validate | ${{ needs.terraform-validate.result }} |"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.backend.result }}" \
            "${{ needs.dashboard.result }}" \
            "${{ needs.dashboard-e2e.result }}" \
            "${{ needs.docs-gate.result }}" \
            "${{ needs.skill-gate.result }}" \
            "${{ needs.codeql.result }}" \
            "${{ needs.secret-scanning.result }}" \
            "${{ needs.terraform-validate.result }}"; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              echo "::error::One or more required CI jobs failed or were cancelled."
              exit 1
            fi
          done
