name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  SQL_SA_PASSWORD: "HotshotCi_Sql2026!LocalOnly"

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      dashboard: ${{ steps.areas.outputs.dashboard }}
      docs: ${{ steps.areas.outputs.docs }}
      terraform: ${{ steps.areas.outputs.terraform }}
      codeql: ${{ steps.areas.outputs.codeql }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Classify changed files
        id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          all() {
            {
              echo "backend=true"
              echo "dashboard=true"
              echo "docs=true"
              echo "terraform=true"
              echo 'codeql=["csharp","javascript-typescript"]'
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          [ "${EVENT_NAME}" = "pull_request" ] || all
          if ! git fetch --no-tags --depth=1 origin "${BASE_SHA}" || ! files="$(git diff --name-only "${BASE_SHA}" HEAD 2>/dev/null)"; then
            echo "Could not fetch or diff against ${BASE_SHA}; running all CI jobs."
            all
          fi
          printf 'Changed files:\n%s\n' "${files}"
          [ -n "${files}" ] || all

          if grep -Eq '^\.github/(workflows/ci\.yml|codeql/)|^7-Deployment/ci/' <<<"${files}"; then
            all
          fi

          has() {
            if grep -Eq "$1" <<<"${files}"; then
              echo true
            else
              echo false
            fi
          }

          backend="$(has '(\.(cs|csproj|props|targets|sln|slnx|editorconfig)$|^global\.json$|^stylecop\.json$|(^|/)nuget\.config$|^(0-Base|1-Presentation/HotshotLogistics\.Api|2-Application|3-Domain|4-Persistence|5-Test|7-Deployment/DbSetup|7-Deployment/docker-compose\.yml)/)')"
          dashboard="$(has '^1-Presentation/admin-dashboard/')"
          docs="$(has '^(6-Docs/|AGENTS\.md$|\.kyber-weave/)')"
          terraform="$(has '^7-Deployment/Azure-deploy/')"
          cs_code="$(has '(\.(cs|csproj|props|targets|sln|slnx)$|^Directory\.Build\.props$)')"
          js_code="$(has '^1-Presentation/admin-dashboard/.*\.(js|mjs|cjs|mts|cts|ts|tsx|jsx)$')"

          langs=()
          [ "${cs_code}" = true ] && langs+=('"csharp"')
          [ "${js_code}" = true ] && langs+=('"javascript-typescript"')
          codeql="[$(IFS=,; echo "${langs[*]:-}")]"

          {
            echo "backend=${backend}"
            echo "dashboard=${dashboard}"
            echo "docs=${docs}"
            echo "terraform=${terraform}"
            echo "codeql=${codeql}"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  backend:
    name: Backend build, format & tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: ${{ env.SQL_SA_PASSWORD }}
          SQLCMDPASSWORD: ${{ env.SQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -l 3 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 18
          --health-start-period 15s
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore HotshotLogistics.sln

      - name: Format check (whitespace)
        run: dotnet format HotshotLogistics.sln whitespace --verify-no-changes --no-restore -v minimal

      - name: Format check (style)
        run: dotnet format HotshotLogistics.sln style --verify-no-changes --severity warn --no-restore -v minimal

      - name: Audit vulnerable NuGet packages
        run: |
          set -euo pipefail
          dotnet list HotshotLogistics.sln package --vulnerable --include-transitive --format json |
            python3 7-Deployment/ci/ci_helpers.py check-nuget-json

      - name: Build solution
        run: dotnet build HotshotLogistics.sln -c Release --no-restore -nr:false -p:UseSharedCompilation=false

      - name: Provision test database and apply migrations
        run: |
          set -euo pipefail
          APP_PASSWORD="Aa1!$(openssl rand -hex 12)"
          echo "::add-mask::${APP_PASSWORD}"
          SA_CS="Server=localhost,1433;Database=master;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
          MIGRATION_CS="Server=localhost,1433;Database=hotshot_logistics_test;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
          APP_CS="Server=localhost,1433;Database=hotshot_logistics_test;User Id=hotshot_app;Password=${APP_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
          echo "::add-mask::${SA_CS}"
          echo "::add-mask::${MIGRATION_CS}"
          echo "::add-mask::${APP_CS}"

          CI_SA_CONNECTION_STRING="${SA_CS}" HOTSHOT_DB_PASSWORD="${APP_PASSWORD}" \
            dotnet run -c Release --no-build --project 7-Deployment/DbSetup/HotshotLogistics.DbSetup/HotshotLogistics.DbSetup.csproj -- \
            --server "localhost,1433" --db-name "hotshot_logistics_test" --app-user "hotshot_app" --non-interactive

          ConnectionStrings__DefaultConnection="${MIGRATION_CS}" \
            dotnet run -c Release --no-build --project 4-Persistence/MigrationRunner/MigrationRunner.csproj

          echo "CONNECTIONSTRINGS__DEFAULTCONNECTION=${APP_CS}" >> "$GITHUB_ENV"

      - name: Test (HotshotLogistics.Tests)
        run: dotnet test 5-Test/tests/HotshotLogistics.Tests/HotshotLogistics.Tests.csproj -c Release --no-build

      - name: Test (HotshotLogistics.IntegrationTests)
        run: dotnet test 5-Test/tests/HotshotLogistics.IntegrationTests/HotshotLogistics.IntegrationTests.csproj -c Release --no-build

      - name: Test (HotshotLogistics.Api.Tests)
        run: dotnet test 5-Test/HotshotLogistics.Api.Tests/HotshotLogistics.Api.Tests.csproj -c Release --no-build

      - name: Test (HotshotLogistics.DbSetup.Tests)
        run: dotnet test 7-Deployment/DbSetup/HotshotLogistics.DbSetup.Tests/HotshotLogistics.DbSetup.Tests.csproj -c Release --no-build

  dashboard:
    name: Dashboard lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    defaults:
      run:
        working-directory: 1-Presentation/admin-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: 1-Presentation/admin-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx --no-install tsc --noEmit --pretty false

      - name: Build
        run: npm run build

  dashboard-e2e:
    name: Dashboard Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    defaults:
      run:
        working-directory: 1-Presentation/admin-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: 1-Presentation/admin-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run Playwright specs (chromium)
        run: npx --no-install playwright test --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: 1-Presentation/admin-dashboard/playwright-report/
          retention-days: 14

  docs-gate:
    name: Docs & links gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate markdown links, todo index, and CI helpers
        run: |
          python3 -m unittest discover -s 7-Deployment/ci -v
          python3 7-Deployment/ci/ci_helpers.py check-docs --root .

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.codeql != '[]'
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.codeql) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  secret-scanning:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog (Pull Request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified

      - name: Run TruffleHog (Push/Schedule/Dispatch)
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          path: ./
          extra_args: --results=verified

  terraform-validate:
    name: Terraform Validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 7-Deployment/Azure-deploy/solution/HotshotLogistics
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Init (backend disabled)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - backend
      - dashboard
      - dashboard-e2e
      - docs-gate
      - codeql
      - secret-scanning
      - terraform-validate
    if: always()
    steps:
      - name: Evaluate gate results
        run: |
          set -euo pipefail
          {
            echo "## CI Results"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Detect changed areas | ${{ needs.changes.result }} |"
            echo "| Backend build, format & tests | ${{ needs.backend.result }} |"
            echo "| Dashboard lint, typecheck & build | ${{ needs.dashboard.result }} |"
            echo "| Dashboard Playwright e2e | ${{ needs.dashboard-e2e.result }} |"
            echo "| Docs & links gate | ${{ needs.docs-gate.result }} |"
            echo "| CodeQL | ${{ needs.codeql.result }} |"
            echo "| Secret Scan (TruffleHog) | ${{ needs.secret-scanning.result }} |"
            echo "| Terraform Validate | ${{ needs.terraform-validate.result }} |"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.backend.result }}" \
            "${{ needs.dashboard.result }}" \
            "${{ needs.dashboard-e2e.result }}" \
            "${{ needs.docs-gate.result }}" \
            "${{ needs.codeql.result }}" \
            "${{ needs.secret-scanning.result }}" \
            "${{ needs.terraform-validate.result }}"; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              echo "::error::One or more required CI jobs failed or were cancelled."
              exit 1
            fi
          done
