name: Setup Kyber-Weave CLI
description: Download, SHA-256 verify, and install the Kyber-Weave CLI for CI gates.

inputs:
  version:
    description: Optional Kyber-Weave release version tag (defaults to latest stable release).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Kyber-Weave CLI
      shell: bash
      env:
        KW_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        installer="${RUNNER_TEMP}/kyber-weave-install.sh"
        # Download then execute (never curl | sh); install.sh verifies release SHA256SUMS.txt.
        curl -fsSL -o "${installer}" \
          https://raw.githubusercontent.com/dpalfery/kyber-weave/main/scripts/install.sh
        args=(--no-mcp --no-arbiter --no-kyberdash)
        if [ -n "${KW_VERSION}" ]; then
          args+=(--version "${KW_VERSION}")
        fi
        sh "${installer}" "${args[@]}"
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

    - name: Verify Kyber-Weave version
      shell: bash
      run: kyber-weave --version
