# Kyber-Weave host configuration. Every ontology default is overridable here.
# Reference: 6-Docs/documentation-ontology.md
ontology:
  docs-root: '6-Docs'

  # Product defaults exclude five DevOps paths from the repository the ontology
  # was first built for. An empty list clears them.
  excluded-files: []

  # Technologies this repository declares a coding standard for. Adding one and
  # re-running 'docs init' creates 6-Docs/standards/<technology>/, publishes its
  # registry property, and legalizes that value in the standard's 'technology' key.
  technologies:
    - azure
    - csharp
    - data-access-layer
    - github-actions
    - maui
    - pulumi
    - python
    - react
    - sql
    - test

mcp:
  # The MCP servers this repository's agent instructions rely on. `docs init` wires these
  # into the harnesses it detects; the declaration is host-owned from the moment it exists
  # and docs init never edits it again.
  required-servers:
    kw-docs:
      command: [kyber-weave-mcp, --repo-root, .]
      provenance: first-party
      level: required
    # A third-party server is declared the same way; its binary is never installed by
    # Kyber-Weave. Uncomment when the repository's instructions require it:
    # codegraph:
    #   command: [codegraph, serve, --mcp]
    #   provenance: third-party
    #   level: recommended
    #   install: codegraph init .   # printed verbatim when the binary is absent

# Additions to the configuration registry rendered into AGENTS.md. Everything
# 'docs init' creates is already published; name only what is yours.
# config-reg:
#   auth-design: 6-Docs/reference/auth-design.md

# Deterministic review gates. Backend gates apply only to backend changes and dashboard gates
# only to dashboard changes. The DB-backed tests (IntegrationTests and the repository and controller
# classes in HotshotLogistics.Tests) need SQL Server: their gates start it first with
# 7-Deployment/dev-env/dev-env-up.sh (idempotent; Docker plus the dotnet user secret
# ConnectionStrings:DefaultConnection, see 6-Docs/dbsetup/onboarding.md). The dashboard's Playwright
# suite is self-contained: every API call is mocked and its config starts `next dev` over plain http
# on port 3100, so a fresh worktree needs only `npm ci` and the Playwright browsers.
review:
  gates:
    - id: dotnet-build
      applies-when:
        paths: &backend-paths ["**/*.cs", "**/*.csproj", "**/*.props", "**/*.targets", "**/*.sln", "**/NuGet.config", "**/.editorconfig", "global.json"]
      run: [dotnet, build, HotshotLogistics.sln, -c, Release, -nr:false, -p:UseSharedCompilation=false]
      blocking: true
      timeout-seconds: 300
    # `--no-build`: the dotnet-build gate above produced these Release binaries.
    - id: unit-tests
      applies-when:
        paths: *backend-paths
      run: [sh, -c, "7-Deployment/dev-env/dev-env-up.sh && dotnet test 5-Test/tests/HotshotLogistics.Tests/HotshotLogistics.Tests.csproj -c Release --no-build"]
      full-suite: true
      blocking: true
      timeout-seconds: 420
    - id: integration-tests
      applies-when:
        paths: *backend-paths
      run: [sh, -c, "7-Deployment/dev-env/dev-env-up.sh && dotnet test 5-Test/tests/HotshotLogistics.IntegrationTests/HotshotLogistics.IntegrationTests.csproj -c Release --no-build"]
      full-suite: true
      blocking: true
      timeout-seconds: 300
    - id: api-tests
      applies-when:
        paths: *backend-paths
      run: [dotnet, test, 5-Test/HotshotLogistics.Api.Tests/HotshotLogistics.Api.Tests.csproj, -c, Release, --no-build]
      full-suite: true
      blocking: true
      timeout-seconds: 300
    - id: dbsetup-tests
      applies-when:
        paths: *backend-paths
      run: [dotnet, test, 7-Deployment/DbSetup/HotshotLogistics.DbSetup.Tests/HotshotLogistics.DbSetup.Tests.csproj, -c, Release, --no-build]
      full-suite: true
      blocking: true
      timeout-seconds: 300
    # The dashboard gates install dependencies when node_modules is missing, so a fresh checkout
    # fails on code, not on a missing install.
    - id: dashboard-lint
      applies-when:
        paths: &dashboard-paths ["1-Presentation/admin-dashboard/**"]
      run: [sh, -c, "test -d node_modules || npm ci --no-audit --no-fund; npm run lint"]
      working-directory: 1-Presentation/admin-dashboard
      blocking: true
      timeout-seconds: 300
    - id: dashboard-typecheck
      applies-when:
        paths: *dashboard-paths
      run: [sh, -c, "test -d node_modules || npm ci --no-audit --no-fund; npx --no-install tsc --noEmit"]
      working-directory: 1-Presentation/admin-dashboard
      blocking: true
      timeout-seconds: 300
    # `next build` runs `prebuild`, which reads the tracked placeholder .env.production, so a fresh
    # worktree builds without .env.local.
    - id: dashboard-build
      applies-when:
        paths: *dashboard-paths
      run: [sh, -c, "test -d node_modules || npm ci --no-audit --no-fund; npm run build"]
      working-directory: 1-Presentation/admin-dashboard
      blocking: true
      timeout-seconds: 300
    # Chromium only: the full three-browser matrix (`npx playwright test`) takes about three times as
    # long and the mocked tests are not browser-specific. `playwright install` is a no-op once the
    # browser is cached.
    - id: dashboard-e2e
      applies-when:
        paths: *dashboard-paths
      run: [sh, -c, "test -d node_modules || npm ci --no-audit --no-fund; npx --no-install playwright install chromium && npx --no-install playwright test --project=chromium"]
      working-directory: 1-Presentation/admin-dashboard
      blocking: true
      timeout-seconds: 300

  # Test classes the `<Stem>Tests` naming convention does not find: a controller is also covered by its
  # HTTP-level IntegrationTests class (a different project from its unit-test class).
  test-map:
    "1-Presentation/HotshotLogistics.Api/Controllers/BillingController.cs": [HotshotLogistics.IntegrationTests.BillingControllerIntegrationTests]
    "1-Presentation/HotshotLogistics.Api/Controllers/CustomerController.cs": [HotshotLogistics.IntegrationTests.CustomerControllerIntegrationTests]
    "1-Presentation/HotshotLogistics.Api/Controllers/DriversController.cs": [HotshotLogistics.IntegrationTests.DriversControllerIntegrationTests]
    "1-Presentation/HotshotLogistics.Api/Controllers/JobAssignmentsController.cs": [HotshotLogistics.IntegrationTests.JobAssignmentsControllerIntegrationTests]
    "1-Presentation/HotshotLogistics.Api/Controllers/JobController.cs": [HotshotLogistics.IntegrationTests.JobControllerIntegrationTests]
    "1-Presentation/HotshotLogistics.Api/Controllers/TrackingController.cs": [HotshotLogistics.IntegrationTests.TrackingControllerIntegrationTests]

  # Per-task gates: what each developer runs on its own change. One developer writes the tests, runs the
  # gate in failing-run mode (`--red`), implements, then runs it again, so every role that writes code
  # needs a build and the tests its change covers, in whichever test project they live.
  # Builds go under a per-task artifacts directory so parallel agents do not share one obj/ tree.
  #   `tests`: `{tests}` expands to the classes covering the change (`review.test-map`, then the
  #   `<Stem>Tests` convention, and a changed test file's own class). A change no class covers is skipped
  #   (KW-REVIEW-026), never run with a filter that matches nothing. 5-Test/run-task-tests.sh then runs
  #   those classes in each test project that declares one (HotshotLogistics.Tests, .IntegrationTests,
  #   .Api.Tests, .DbSetup.Tests, and any project added later), starts SQL Server first for the DB-backed
  #   ones (dev-env-up.sh takes a lock, so parallel workers queue instead of racing), and fails with exit 8
  #   if no project ran a test. It runs after `dotnet-build` and rebuilds incrementally into the same
  #   artifacts path (not `--no-build`), so a failing run's missing-symbol errors reach the test gate too.
  #   `dashboard-e2e`: 1-Presentation/admin-dashboard/scripts/task-e2e.sh runs the changed Playwright specs
  #   and the specs covering a changed component by naming convention (chromium only).
  task-gates:
    csharp-dev:
      - &task-build
        id: dotnet-build
        include: ["**/*.cs", "**/*.csproj", "**/*.props", "**/*.targets", "**/*.sln", "**/NuGet.config", "**/.editorconfig"]
        run: [dotnet, build, HotshotLogistics.sln, -c, Release, --artifacts-path, ".agent_scratchpad/{task}/artifacts", -nr:false, -p:UseSharedCompilation=false]
        timeout: 300
      - &task-tests
        id: tests
        include: ["**/*.cs"]
        run: [bash, 5-Test/run-task-tests.sh, "{tests}", ".agent_scratchpad/{task}/artifacts"]
        timeout: 600
    dal-dev:
      - *task-build
      - *task-tests
    test-dev:
      - *task-build
      - *task-tests
      - &task-e2e
        id: dashboard-e2e
        include: ["1-Presentation/admin-dashboard/src/**", "1-Presentation/admin-dashboard/tests/**", "1-Presentation/admin-dashboard/playwright.config.ts"]
        # "$@" is the expanded {changed}. No working-directory: the schema refuses it together with {changed}.
        run: [bash, 1-Presentation/admin-dashboard/scripts/task-e2e.sh, "{changed}"]
        timeout: 420
    react-dev:
      - &task-lint
        id: dashboard-lint
        include: ["1-Presentation/admin-dashboard/**"]
        run: [sh, -c, "cd 1-Presentation/admin-dashboard && (test -d node_modules || npm ci --no-audit --no-fund) && npm run lint"]
        timeout: 300
      - &task-typecheck
        id: dashboard-typecheck
        include: ["1-Presentation/admin-dashboard/**"]
        # tsc runs from the repository root so its diagnostics name repository-relative paths, which is how
        # a failing run (--red) tells a missing symbol in the task's own test from any other error.
        run: [sh, -c, "(test -d 1-Presentation/admin-dashboard/node_modules || (cd 1-Presentation/admin-dashboard && npm ci --no-audit --no-fund)) && 1-Presentation/admin-dashboard/node_modules/.bin/tsc --noEmit --pretty false -p 1-Presentation/admin-dashboard"]
        timeout: 300
      - &task-build-dashboard
        id: dashboard-build
        include: ["1-Presentation/admin-dashboard/**"]
        # tsc runs first, from the repository root, so a type error is reported as the clean
        # repository-relative diagnostic a failing run (--red) reads; next build's own output wraps
        # that line in progress text the classifier cannot attribute to the task's files.
        run: [sh, -c, "(test -d 1-Presentation/admin-dashboard/node_modules || (cd 1-Presentation/admin-dashboard && npm ci --no-audit --no-fund)) && 1-Presentation/admin-dashboard/node_modules/.bin/tsc --noEmit --pretty false -p 1-Presentation/admin-dashboard && cd 1-Presentation/admin-dashboard && npm run build"]
        timeout: 300
      - *task-e2e
    typescript-dev:
      - *task-lint
      - *task-typecheck
      - *task-build-dashboard
      - *task-e2e

onboarding: done
